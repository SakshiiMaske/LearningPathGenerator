<div class="w-full flex flex-col items-center text-center px-4 py-28 bg-gray-50">

  <!-- Heading -->
  <h1 class="text-4xl font-bold text-gray-900 tracking-tight">
    Choose your <span class="text-sky-600">career goal</span>
  </h1>

  <p class="mt-3 text-lg text-gray-600 max-w-2xl">
    Get a personalized learning path for any tech career.
  </p>

  <!-- Search Section -->
  <div class="mt-12 w-full max-w-xl relative">

    <div
      class="flex items-center bg-white border border-gray-300 rounded-xl px-4 py-3 shadow-sm
             transition focus-within:ring-2 focus-within:ring-sky-200">

      <span class="material-icons text-gray-500 mr-3">search</span>

      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="filterSuggestions()"
        placeholder="Search a career e.g. Java Developer"
        class="w-full outline-none text-gray-800"
      />

      <span
        (click)="toggleDropdown()"
        class="material-icons text-gray-500 cursor-pointer ml-3"
      >
        expand_more
      </span>
    </div>

    <!-- Dropdown -->
    <div
      *ngIf="showDropdown"
      class="absolute w-full mt-2 bg-white border border-gray-200 rounded-xl shadow-lg
             max-h-60 overflow-y-auto z-10"
    >
      <div
        *ngFor="let item of filteredCareers"
        (click)="selectCareer(item)"
        class="px-4 py-3 hover:bg-gray-100 cursor-pointer text-gray-800"
      >
        {{ item }}
      </div>
    </div>
  </div>

  <!-- Button -->
  <button
    (click)="goToLearningPath()"
    class="mt-8 px-7 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold shadow-md transition">
    Generate Learning Path
  </button>
  <!-- AI LOADING OVERLAY -->
<div *ngIf="loading" class="loader-container">
  <div class="ai-loader"></div>
  <p class="loader-text">Generating your learning path...</p>
</div>

</div>
