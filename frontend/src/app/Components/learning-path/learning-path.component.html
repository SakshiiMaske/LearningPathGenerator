<div class="min-h-screen bg-sky-50 flex justify-center py-12 px-4">
  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl p-10">

    <!-- Title -->
    <h1 class="text-3xl font-semibold text-slate-900 text-center mb-3">
      {{ learningPath?.goal }}
    </h1>

    <!-- Estimated Duration -->
    <p class="text-center text-slate-600 mb-10">
      Estimated Duration: {{ learningPath?.estimated }}
    </p>

    <!-- Steps -->
    <div class="space-y-6" *ngIf="learningPath?.steps">

      <ng-container *ngFor="let step of learningPath.steps">
        <div class="rounded-2xl border border-slate-200 p-6 bg-white shadow-sm">
 
          <div class="flex justify-between items-start">
            <div>
              <p class="text-slate-500 font-medium text-sm mb-1">
                Step {{ step.id }}
              </p>

              <h3 class="text-xl font-semibold text-slate-900 leading-tight">
                {{ step.title }}
              </h3>
            </div>

            <span *ngIf="step.duration"
              class="px-3 py-1 rounded-full bg-sky-50 text-sky-700 text-sm font-medium border border-sky-100">
              {{ step.duration }}
            </span>
          </div>

          <!-- Bullet List -->
          <ul class="mt-4 list-disc list-inside text-slate-700 space-y-1">
            <li *ngFor="let b of step.bullets">{{ b }}</li>
          </ul>

        </div>
      </ng-container>

    </div>

    <!-- Buttons -->
    <div class="mt-10 flex flex-wrap justify-between items-center gap-4">

      <div class="flex gap-3">

        <button (click)="onDownloadPDF()"
          class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold shadow-md">
          Download PDF
        </button>

        <button (click)="onSaveToProfile()" 
          class="px-5 py-2.5 rounded-xl bg-sky-100 hover:bg-sky-200 
           text-sky-800 font-medium border border-sky-200">
          Save to Profile
        </button>

        <button (click)="onRegenerate()" 
          class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 
           text-slate-700 font-medium border border-slate-200">
          Regenerate
        </button>

      </div>

      <p class="text-xs text-slate-400">
        Tip: Click Download to print/save this path.
      </p>

    </div>
  </div>
</div>


<div 
  *ngIf="showSavePopup"
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm z-50"
>
  <div class="bg-white w-[28rem] p-8 rounded-3xl shadow-2xl animate-[fadeIn_.25s_ease-out]">

    <h2 class="text-2xl font-semibold text-gray-900 mb-4 text-center">
      Saved Successfully!
    </h2>

    <p class="text-gray-600 text-base text-center leading-relaxed mb-8">
      Your learning path has been added to your profile.
    </p>

    <div class="flex gap-4">
      <button
        (click)="goToSavedPaths()"
        class="flex-1 py-3 rounded-xl bg-sky-600 text-white text-base font-semibold 
               hover:bg-sky-700 transition shadow-sm">
        View Saved Paths
      </button>

      <button
        (click)="closeSavePopup()"
        class="flex-1 py-3 rounded-xl bg-gray-200 text-gray-800 text-base font-medium 
               hover:bg-gray-300 transition shadow-sm">
        Close
      </button>
    </div>

  </div>
</div>
